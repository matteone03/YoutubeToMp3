[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtubetomp3"
version = "0.1.0"
description = "Personal desktop app that saves selected YouTube channel videos as MP3 files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.6",
  "yt-dlp>=2025.1.1",
  "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
youtubetomp3 = "youtubetomp3.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
